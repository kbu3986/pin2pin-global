<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Pin2Pin Global — Datasheet-Verified Semiconductor Pinout &amp; Cross-Reference DB">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.65"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Left Editorial Block -->
  <g transform="translate(72, 92)">
    <rect x="0" y="0" width="380" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#6ee7b7">
      DUAL-PATH PDF + 300 DPI VISION AUDITED
    </text>

    <text x="0" y="114" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1">
      Pin2Pin Global
    </text>
    <text x="0" y="168" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">
      OPN-Exact Semiconductor Pinout &amp;
    </text>
    <text x="0" y="206" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">
      Cross-Reference Engineering Workbench
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 260)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">
      <rect x="0" y="0" width="176" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="88" y="26" text-anchor="middle" fill="#e2e8f0">SVG Pin Diffs</text>

      <rect x="192" y="0" width="212" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="298" y="26" text-anchor="middle" fill="#e2e8f0">Zero-Upload BOM</text>

      <rect x="420" y="0" width="210" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="525" y="26" text-anchor="middle" fill="#e2e8f0">Official PDFs Only</text>
    </g>

    <text x="0" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#38bdf8">
      LDO · DC-DC · OP-AMP · COMPARATOR · PINOUT MATCHER · CALCULATORS
    </text>
  </g>

  <!-- Right Blueprint IC Pinout Motif -->
  <g transform="translate(810, 128)">
    <rect x="0" y="0" width="320" height="374" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="160" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">
