    <!-- Left 3 Leads -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">
      <rect x="64" y="96" width="28" height="16" rx="2" fill="#dc2626"/>
      <text x="54" y="109" text-anchor="end" fill="#fca5a5">1 VIN</text>

      <rect x="64" y="170" width="28" height="16" rx="2" fill="#64748b"/>
      <text x="54" y="183" text-anchor="end" fill="#cbd5e1">2 GND</text>

      <rect x="64" y="244" width="28" height="16" rx="2" fill="#7c3aed"/>
