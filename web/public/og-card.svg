    </g>

    <!-- Right 2 Leads -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">
      <rect x="228" y="96" width="28" height="16" rx="2" fill="#2563eb"/>
      <text x="266" y="109" text-anchor="start" fill="#93c5fd">5 OUT</text>

      <rect x="228" y="244" width="28" height="16" rx="2" fill="#10b981"/>
      <text x="266" y="257" text-anchor="start" fill="#6ee7b7">4 NC</text>
