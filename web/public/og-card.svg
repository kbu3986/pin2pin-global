    <rect x="28" y="314" width="264" height="36" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="337" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#6ee7b7">
