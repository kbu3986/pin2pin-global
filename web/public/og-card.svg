    <!-- Package Body -->
    <rect x="92" y="68" width="136" height="220" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="114" cy="92" r="7" fill="#f8fafc"/>
    <text x="160" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#ffffff">
